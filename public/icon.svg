<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1026" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="neonPinkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#27272a" stroke-width="4" />
  
  <!-- Sunset Circle -->
  <circle cx="256" cy="230" r="130" fill="url(#sunGrad)" opacity="0.85" />
  
  <!-- Retro Sun Blinds / Slices -->
  <rect x="120" y="240" width="272" height="8" rx="4" fill="#09090b" />
  <rect x="135" y="260" width="242" height="10" rx="5" fill="#09090b" />
  <rect x="155" y="285" width="202" height="12" rx="6" fill="#09090b" />
  <rect x="180" y="315" width="152" height="14" rx="7" fill="#09090b" />

  <!-- Palm Silhouette Left -->
  <path d="M140 430 Q160 310 210 260 Q170 250 120 280 Q180 230 220 255 Q200 200 150 200 Q210 210 230 250 Q230 180 200 150 Q240 180 240 245 Q260 170 280 140 Q265 190 250 245" fill="#09090b" opacity="0.9" />

  <!-- VI Stylized Roman Numerals -->
  <g filter="url(#glow)">
    <!-- V -->
    <path d="M190 190 L235 340 L270 340 L315 190 L285 190 L252 300 L220 190 Z" fill="url(#neonPinkCyan)" />
    <!-- I -->
    <path d="M330 190 L330 340 L360 340 L360 190 Z" fill="url(#neonPinkCyan)" />
  </g>

  <!-- Star Accent -->
  <polygon points="380,180 385,195 400,200 385,205 380,220 375,205 360,200 375,195" fill="#06b6d4" opacity="0.9" />

  <!-- App Name Subtitle -->
  <text x="256" y="420" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#ffffff" text-anchor="middle">LEONIDA</text>
  <text x="256" y="448" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#06b6d4" text-anchor="middle">100% COMPANION</text>
</svg>
